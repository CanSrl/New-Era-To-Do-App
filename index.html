<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/masked-icon.svg" color="#4f46e5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b12" />
    <!--
      Yazı tipleri yerelden gelir (`public/fonts/`, @font-face tanımları
      `src/index.css` içinde). Buraya bir Google Fonts <link>'i geri
      koymayın: uygulama çevrimdışı çalışan bir PWA ve landing testi
      localhost dışına hiç istek yapılmamasını şart koşuyor.
      Latin alt kümeleri ilk boyamada gerektiği için önden yüklenir.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/inter-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" />
    <title>Yapılacaklar Listesi — Modern Görev Yöneticisi</title>
    <meta name="description" content="Modern, hızlı ve çevrimdışı çalışabilen görev yöneticisi. Kategoriler, öncelikler, sürükle-bırak sıralama ve PWA desteğiyle görevlerinizi kolayca yönetin." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yapılacaklar Listesi — Modern Görev Yöneticisi" />
    <meta property="og:description" content="Modern, hızlı ve çevrimdışı çalışabilen görev yöneticisi." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Yapılacaklar Listesi — Modern Görev Yöneticisi" />
    <meta name="twitter:description" content="Modern, hızlı ve çevrimdışı çalışabilen görev yöneticisi." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
