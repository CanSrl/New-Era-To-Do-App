name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı dala arka arkaya push yapılırsa eski çalıştırma iptal edilir.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kalite:
    name: Lint, tip ve birim testleri
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npx tsc -b --noEmit

      - name: Birim testleri
        run: npm test

      - name: Üretim derlemesi
        run: npm run build

      # Modülün bayrak kapalıyken paketten izsiz çıktığını ölçer. Bu, starter
      # kit satış argümanının kanıtı ve daha önce sessizce bozuktu: bayrak bir
      # nesne özelliği olduğu için dallar katlanmıyor, kapalı derleme açık
      # olanla aynı boyutta çıkıyordu. Script iki yönü de sınar (kapalıyken
      # yok, açıkken var), o yüzden iki derleme çalıştırır.
      - name: Niş modül eleme doğrulaması
        run: npm run verify:niche

  entegrasyon:
    name: Şema ve uçtan uca testler
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Yalnızca testlerin ihtiyaç duyduğu servisler başlatılır: veritabanı,
      # ağ geçidi, auth ve REST. Studio, storage, realtime gibi servisleri
      # dışarıda bırakmak imaj indirmesini ve açılış süresini belirgin şekilde
      # kısaltır.
      - name: Supabase yığınını başlat
        run: |
          supabase start \
            -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Ortam değişkenlerini yaz
        run: |
          API_URL=$(supabase status -o json | jq -r '.API_URL')
          ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env.local

      # Şema güvenlik testleri: RLS politikalarının gerçekten uygulandığını
      # iki ayrı kullanıcı oluşturarak doğrular.
      - name: Şema güvenlik testleri
        run: npm run test:rls

      - name: Playwright tarayıcısını kur
        run: npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Hata raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-raporu
          path: |
            playwright-report/
            test-results/
          retention-days: 7
